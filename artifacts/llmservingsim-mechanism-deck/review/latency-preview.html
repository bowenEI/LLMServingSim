le=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#E7F4F1;strokeColor=#2A7F72;strokeWidth=2;fontColor=#17324D;fontFamily=Noto Sans CJK SC;fontSize=15;align=center;verticalAlign=middle;spacing=8;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"580\" y=\"530\" width=\"440\" height=\"50\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"legend_comm\" value=\"&lt;b&gt;COMM_NODE&lt;/b&gt;&lt;br&gt;&lt;font style=&quot;font-size:13px&quot;&gt;analytical network&lt;/font&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFF0E3;strokeColor=#C86F2D;strokeWidth=2;fontColor=#17324D;fontFamily=Noto Sans CJK SC;fontSize=15;align=center;verticalAlign=middle;spacing=8;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"1100\" y=\"530\" width=\"440\" height=\"50\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"s1\" value=\"kernel shape\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;endArrow=block;endFill=1;strokeWidth=3;strokeColor=#2F6B9A;fontColor=#2F6B9A;fontFamily=Noto Sans CJK SC;fontSize=12;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"shape\" target=\"comp\">\n          <mxGeometry relative=\"1\" as=\"geometry\">\n            <Array as=\"points\">\n              <mxPoint x=\"280\" y=\"220\" />\n              <mxPoint x=\"280\" y=\"240\" />\n            </Array>\n          </mxGeometry>\n        </mxCell>\n        <mxCell id=\"s2\" value=\"bytes / tier\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;endArrow=block;endFill=1;strokeWidth=3;strokeColor=#2A7F72;fontColor=#2A7F72;fontFamily=Noto Sans CJK SC;fontSize=12;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"shape\" target=\"mem\">\n          <mxGeometry relative=\"1\" as=\"geometry\">\n            <Array as=\"points\">\n              <mxPoint x=\"800\" y=\"220\" />\n              <mxPoint x=\"800\" y=\"240\" />\n            </Array>\n          </mxGeometry>\n        </mxCell>\n        <mxCell id=\"s3\" value=\"group / size\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;endArrow=block;endFill=1;strokeWidth=3;strokeColor=#C86F2D;fontColor=#C86F2D;fontFamily=Noto Sans CJK SC;fontSize=12;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"shape\" target=\"comm\">\n          <mxGeometry relative=\"1\" as=\"geometry\">\n            <Array as=\"points\">\n              <mxPoint x=\"1320\" y=\"220\" />\n              <mxPoint x=\"1320\" y=\"240\" />\n            </Array>\n          </mxGeometry>\n        </mxCell>\n        <mxCell id=\"c1\" value=\"COMP_NODE\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;endArrow=block;endFill=1;strokeWidth=3;strokeColor=#2F6B9A;fontColor=#2F6B9A;fontFamily=Noto Sans CJK SC;fontSize=12;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"comp\" target=\"dag\">\n          <mxGeometry relative=\"1\" as=\"geometry\">\n            <Array as=\"points\">\n              <mxPoint x=\"280\" y=\"570\" />\n              <mxPoint x=\"800\" y=\"570\" />\n              <mxPoint x=\"800\" y=\"600\" />\n            </Array>\n          </mxGeometry>\n        </mxCell>\n        <mxCell id=\"m1\" value=\"MEM_NODE\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;endArrow=block;endFill=1;strokeWidth=3;strokeColor=#2A7F72;fontColor=#2A7F72;fontFamily=Noto Sans CJK SC;fontSize=12;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"mem\" target=\"dag\">\n          <mxGeometry relative=\"1\" as=\"geometry\">\n            <Array as=\"points\">\n              <mxPoint x=\"800\" y=\"570\" />\n              <mxPoint x=\"800\" y=\"600\" />\n            </Array>\n          </mxGeometry>\n        </mxCell>\n        <mxCell id=\"n1\" value=\"COMM_NODE\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;endArrow=bloc const diagramTitle = "latency-model.drawio";
const DRAWIO_ORIGIN = 'https://embed.diagrams.net';
const iframe = document.getElementById('drawio');
let loaded = false;
function downloadXml(savedXml) {
  const blob = new Blob([savedXml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const cleanTitle = diagramTitle.endsWith('.drawio') ? diagramTitle : `${diagramTitle}.drawio`;
  link.href = url;
  link.download = cleanTitle;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function sendLoad() {
  iframe.contentWindow.postMessage(JSON.stringify({
    action: 'load',
    autosave: 0,
    modified: 0,
    title: diagramTitle,
    xml
  }), DRAWIO_ORIGIN);
}
window.__drawioPreview = {
  requestSave: () => iframe.contentWindow.postMessage(JSON.stringify({ action: 'save' }), DRAWIO_ORIGIN)
};
window.addEventListener('message', (evt) => {
  if (evt.source !== iframe.contentWindow || evt.origin !== DRAWIO_ORIGIN) return;
  let msg = evt.data;
  try { if (typeof msg === 'string') msg = JSON.parse(msg); } catch (e) { return; }
  if (!msg) return;
  if (msg.event === 'save' && msg.xml) {
    downloadXml(msg.xml);
    iframe.contentWindow.postMessage(JSON.stringify({
      action: 'status',
      modified: false,
      message: 'Downloaded .drawio file'
    }), DRAWIO_ORIGIN);
    return;
  }
  if (!loaded && (msg.event === 'init' || msg.event === 'configure')) {
    loaded = true;
    sendLoad();
  }
});
setTimeout(() => { if (!loaded) sendLoad(); }, 2500);
</script>
